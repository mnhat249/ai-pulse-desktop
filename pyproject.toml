[project]
name = "neuralradar"
version = "0.1.0"
description = "App Windows chạy ngầm: gom, lọc trùng, lọc rác và tóm tắt tin AI bằng tiếng Việt."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.5",
    "apscheduler>=3.10,<4",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "keyring>=25",
    "numpy>=1.26",
    "fastembed>=0.3",
    "google-genai>=1.0",
    "groq>=0.11",
    "customtkinter>=5.2",
    "pystray>=0.19",
    "Pillow>=10.0",
    "winotify>=1.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["pipeline/prompts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = ["app/storage/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S603", "S607"]
".claude/hooks/*" = ["S603"]
"tests/*" = ["S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "keyring.*", "alembic.*", "sklearn.*", "customtkinter.*", "pystray.*", "winotify.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
